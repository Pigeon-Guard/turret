services:
  control:
    image: ghcr.io/pigeon-guard/turret-control:latest
    privileged: true
    depends_on:
      - message
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_TOPIC=${MQTT_TOPIC}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID}
    restart: unless-stopped
  ui:
    image: ghcr.io/pigeon-guard/turret-ui:latest
    ports:
      - "80:8080"
    depends_on:
      - message
      - video
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_TOPIC=${MQTT_TOPIC}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID}
      - WEBRTC_URL=${WEBRTC_URL}
    restart: unless-stopped
  video:
    image: bluenviron/mediamtx:1-rpi
    network_mode: host
    privileged: true
    tmpfs:
      - /dev/shm:exec
    volumes:
      - /run/udev:/run/udev:ro
    environment:
      - MTX_PATHS_CAM_SOURCE=rpiCamera
      - MTX_PATHS_CAM_RPICAMERAWIDTH=1024
      - MTX_PATHS_CAM_RPICAMERAHEIGHT=1024
      - MTX_PATHS_CAM_RPICAMERAFPS=10
      - MTX_PATHS_CAM_RPICAMERABITRATE=800000
      - MTX_WEBRTC=true
      - MTX_RTSP=true
      - MTX_RTMP=false
      - MTX_HLS=false
      - MTX_SRT=false
      - MTX_MOQ=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "localhost", "8554"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  message:
    image: emqx/nanomq:latest
    ports:
      - "1883:1883"
      - "8083:8083"
    environment:
      - NANOMQ_BROKER_URL=nmq-tcp://0.0.0.0:1883
      - NANOMQ_ALLOW_ANONYMOUS=true
      - NANOMQ_HTTP_SERVER_ENABLE=false
      - NANOMQ_WEBSOCKET_ENABLE=true
      - NANOMQ_WEBSOCKET_URL=nmq-ws://0.0.0.0:8083/mqtt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "localhost", "1883"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s